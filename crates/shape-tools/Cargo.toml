[package]
name = "shape-tools"
description = "og-shape tools: GLB, OBJ and STL export, a deterministic CPU turntable preview with a PNG encoder, and mesh tools: import, repair, decimate, UV unwrap and measure."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
shape-core.workspace = true
shape-mesh.workspace = true
shape-bool.workspace = true
shape-gen.workspace = true
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extras"] }
shape-2d.workspace = true
shape-skin.workspace = true

[lints]
workspace = true
