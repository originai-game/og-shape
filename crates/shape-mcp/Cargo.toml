[package]
name = "shape-mcp"
description = "An MCP server (stdio) over og-shape: build, preview, measure and export model programs, run TypeScript programs through the binding, and the mesh tools, confined to a workspace directory."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "shape_mcp"
path = "src/lib.rs"

[[bin]]
name = "shape-mcp"
path = "src/main.rs"

[dependencies]
shape-cli = { path = "../shape-cli" }
shape-tools.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
shape-model.workspace = true
