[workspace]
resolver = "3"
members = ["crates/*"]
# Measurement tools with their own dependencies (manifold-rust pulls in
# BSL-1.0 code); never part of the kernel or its licence gate.
exclude = ["bench"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/originai-game/og-shape"
publish = false

[workspace.dependencies]
shape-core = { path = "crates/shape-core" }
glam = { version = "0.34", default-features = false, features = ["std", "f64", "i64", "u32", "libm", "scalar-math"] }
libm = "0.2"
robust = "1"
sha2 = "0.11"
spade = "2.15.1"
i_overlay = { version = "9.1.0", default-features = false }
shape-2d = { path = "crates/shape-2d" }
shape-gen = { path = "crates/shape-gen" }
shape-bool = { path = "crates/shape-bool" }
shape-mesh = { path = "crates/shape-mesh" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
float_cmp = "allow"
